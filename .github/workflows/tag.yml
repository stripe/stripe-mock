name: Create Tag and trigger release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name, defaults to minor increment."
        required: false
      sha:
        description: "Commit SHA to tag. Defaults to latest."
        required: false

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set the commit SHA
        id: sha
        run: echo "commitSha=$(if [ -z "$SHA" ]; then echo $GITHUB_SHA; else echo $SHA; fi)" >> "$GITHUB_OUTPUT"
        env:
          SHA: ${{ github.event.inputs.sha }}
      - name: Set the tag
        id: tag
        run: |
          last_tag="$(git describe --tags --abbrev=0)"
          # Parse the version into parts, increment the minor version and reset the patch to 0
          # Example:
          # v1.2.3 is parsed into $1 = "v1.", $2 = "2", $3 = ".3"
          # and concatenated back into v1.3.0
          new_tag="$(echo "$last_tag" | perl -pe 's/^(v\d+\.)(\d+)(\.\d+)$/$1.($2+1).".0"/e')"
          echo "newTag=$(if [ -z "$TAG" ]; then echo $new_tag; else echo $TAG; fi)" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ github.event.inputs.tag }}
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: gh-api-token
        with:
          app-id: ${{ secrets.GH_APP_STRIPE_OPENAPI_APP_ID }}
          private-key: ${{ secrets.GH_APP_STRIPE_OPENAPI_PRIVATE_KEY }}
          # The token's only use is creating a tag ref in this repository. Scope
          # defaults to the current repository when owner and repositories are unset.
          permission-contents: write
      - name: Create tag
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NEW_TAG: ${{ steps.tag.outputs.newTag }}
          COMMIT_SHA: ${{ steps.sha.outputs.commitSha }}
        with:
          github-token: ${{ steps.gh-api-token.outputs.token }}
          script: |
            github.rest.git.createRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `refs/tags/${process.env.NEW_TAG}`,
              sha: process.env.COMMIT_SHA
            })
