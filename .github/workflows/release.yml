on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Code checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Docker Login
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "${DOCKER_PASSWORD}" | docker login --username "${DOCKER_USERNAME}" --password-stdin
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # This job publishes signed release binaries and Docker images. Restoring a
          # build cache that lower-privilege workflows can write (ci.yml runs on every
          # push with no branch filter) would let poisoned cache contents execute
          # alongside the Docker login and the GitHub App token below.
          cache: false
      # Fetch app token
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: gh-api-token
        with:
          app-id: ${{ secrets.GH_APP_STRIPE_OPENAPI_APP_ID }}
          private-key: ${{ secrets.GH_APP_STRIPE_OPENAPI_PRIVATE_KEY }}
          # goreleaser publishes the release here and pushes the Homebrew formula to
          # stripe/homebrew-stripe-mock, so the token needs exactly those two repos and
          # nothing else. owner is omitted because it defaults to this repo's owner.
          repositories: stripe-mock,homebrew-stripe-mock
          permission-contents: write
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: ~v2.16.0
          args: release -f goreleaser.yml --clean
        env:
          GITHUB_TOKEN: ${{ steps.gh-api-token.outputs.token }}
      - uses: stripe/openapi/actions/notify-release@325f3b157f7250f2a5d228b870d77bb63fc7e54c # v2407
        if: always()
        with:
          bot_token: ${{ secrets.SLACK_BOT_TOKEN }}
